<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Listagem de Vagas</title>
</head>

<body class="bg-gray-900 h-screen flex flex-col">

<nav class="bg-zinc-900 p-4 flex justify-between items-center">
    <div>
        <a href="/company/jobs" class="text-white text-lg font-semibold">Cadastro</a>

    </div>
    <div>
        <a href="/company/jobs/list" class="text-white text-lg font-semibold">Listagem</a>
    </div>
    <div>
        <a href="/company/logout" class="text-white text-lg font-semibold">Logout</a>
    </div>
</nav>
    <p class="text-center text-white text-3xl pt-5">Listagem de Vagas</p>
    <div class="flex-glow flex pt-10 justify-center">

<div class="pb-3 w-9/12 max-w-full">
    <table class="w-full">
        <thead>
            <tr class="bg-gray-200">
                <th class="text-left py-2 px-4">ID</th>
                <th class="text-left py-2 px-4">Descrição</th>
                <th class="text-left py-2 px-4">Benefícios</th>
                <th class="text-left py-2 px-4">Nível</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="jobs: ${jobs}" class="text-white">
                <td class="border px-4 py-2" th:text="${jobs.id}">1</td>
                <td class="border px-4 py-2" th:text="${jobs.description}"></td>
                <td class="border px-4 py-2" th:text="${jobs.benefits}"></td>
                <td class="border px-4 py-2" th:text="${jobs.level}">Level</td>
            </tr>
        </tbody>
    </table>
</div>
    </div>

</body>
</html>
